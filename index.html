 popup('🎰 Casino',`<p>Roulette européenne : 18 rouges, 18 noirs et 1 vert (zéro).</p><label class="casino-label">Ta mise (€)<input id="casino-stake" type="number" inputmode="numeric" min="1" max="${Math.floor(p.cash)}" step="1" value="${Math.min(100,Math.floor(p.cash))}"></label><p class="hint">Rouge / Noir : gain net de 1× la mise (18/37). Vert : gain net de 35× la mise (1/37). Mise maximale : ${money(p.cash)}.</p>`,[['Ne pas jouer',()=>{say('Tu quittes le casino sans miser.');finish(true)}]]);
 const buttonsArea=$('modalactions');
 for(const [color,label] of [['red','🔴 Rouge'],['black','⚫ Noir'],['green','🟢 Vert']]){
  const btn=document.createElement('button');btn.textContent=label;btn.className='casino-bet '+color;
  btn.onclick=()=>{
   const stake=Number($('casino-stake').value);
   if(!Number.isInteger(stake)||stake<1||stake>Math.floor(p.cash)){alert(`Entre une mise entière de 1 à ${Math.floor(p.cash)} €.`);return}
   close();phase='casino';buttons([]);const n=Math.floor(Math.random()*37),resultColor=n===0?'green':rouletteRed.has(n)?'red':'black';
   const resultLabel={red:'🔴 Rouge',black:'⚫ Noir',green:'🟢 Vert'}[resultColor];
   say('🎰 La roulette tourne…');
   const overlay=document.createElement('div');overlay.className='casino-spin';overlay.innerHTML='<div class="roulette-wheel">🎰</div><div>La roulette tourne…</div>';
   $('board').appendChild(overlay);tone(440,.1,0,'triangle',.06);tone(540,.1,.2,'triangle',.06);
   setTimeout(()=>{
    overlay.remove();p.cash-=stake;
    const won=color===resultColor;
    if(won)p.cash+=stake*(color==='green'?36:2);
    const delta=won?stake*(color==='green'?35:1):-stake;
    addlog(`${p.name} mise ${money(stake)} sur ${label}. Roulette ${n} ${resultLabel} : ${won?'gain':'perte'} ${money(Math.abs(delta))}.`);
    if(won)soundPurchase();else soundRent();
    render();say(`🎰 ${n} ${resultLabel} ! ${won?'Gagné : +':'Perdu : −'}${money(Math.abs(delta))}.`);
    if(p.cash<0){checkDebt(p);return}
    finish(true);
   },1650);
  };buttonsArea.prepend(btn)
 }
}

function rob(){let p=active();let targets=players.filter((x,i)=>i!==current&&!x.bankrupt);popup('💥 Braquage',`Choisis une victime. Réussite : vol de 200 € (dans la limite de ses liquidités positives). Échec : indemnité égale à 10 % de ton solde positif, minimum 100 €, et 3 tours de GAV.`,[...targets.map(t=>[t.name,()=>{let success=Math.random()<.5;if(success){let amount=Math.min(200,Math.max(0,t.cash));t.cash-=amount;p.cash+=amount;say(`Braquage réussi ! +${money(amount)} pris à ${t.name}.`);addlog(`${p.name} braque ${t.name} : +${money(amount)}.`);finish()}else{let due=Math.max(100,round10(Math.max(0,p.cash)*.1));p.jail=3;let owned=cells.filter(c=>c.owner===current);if(p.cash>=due){p.cash-=due;t.cash+=due;addlog(`${p.name} rate son braquage, verse ${money(due)} et part en GAV.`);say(`Braquage raté : -${money(due)} et 3 tours de GAV.`);finish()}else if(owned.length){popup('Braquage raté !',`Liquidités insuffisantes : cède une propriété de ton choix à ${t.name}. Tu écopes aussi de 3 tours de GAV.`,owned.map(c=>[c.name,()=>{c.owner=players.indexOf(t);addlog(`${p.name} cède ${c.name} à ${t.name} et part en GAV.`);finish()}]))}else{p.cash-=due;t.cash+=due;addlog(`${p.name} paie ${money(due)} même en négatif et part en GAV.`);say(`Braquage raté : -${money(due)} et 3 tours de GAV.`);finish()}}}]),['Annuler',finish]])}
function reset(){clearStep();clearDice();endDealPeek();loot=0;$('setup').classList.remove('hidden');$('game').classList.add('hidden');close()}$('restart').onclick=()=>popup('Recommencer ?','La partie en cours sera perdue.',[['Oui, recommencer',reset],['Annuler',()=>{}]]);$('start').onclick=()=>{clearStep();clearDice();phase='roll';let n=+$('count').value;players=Array.from({length:n},(_,i)=>({name:`Joueur ${i+1}`,cash:1500,pos:0,jail:0,bankrupt:false}));cells.forEach(c=>c.owner=-1);current=0;loot=0;endDealPeek();logs=[];$('setup').classList.add('hidden');$('game').classList.remove('hidden');render();say('Bienvenue dans BROKE! Lance le dé pour commencer.');buttons([['🎲 Lancer le dé',move]])};
</script></body></html>

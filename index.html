<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171329"><title>BROKE! — Jeu</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f7f4ff;background:#171329}*{box-sizing:border-box}body{margin:0;padding:14px 12px 40px;max-width:650px;margin-inline:auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}h1{margin:0;font-size:30px;color:#f7d75d;letter-spacing:2px}.tag{font-size:11px;color:#aaa2c7}button,select,input{font:inherit}button{background:#f7d75d;color:#231a29;border:0;border-radius:11px;padding:12px;font-weight:800;cursor:pointer}button:disabled{opacity:.38;cursor:not-allowed}.secondary{background:#3d3455;color:white}.danger{background:#e8697c;color:#210e15}.panel{background:#28213c;border:1px solid #453958;border-radius:15px;padding:12px;margin:10px 0}.setup{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.setup select{background:#403552;color:white;border:1px solid #75628c;border-radius:8px;padding:9px}.board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));aspect-ratio:1/1;gap:2px;background:#5c4b6c;padding:3px;border-radius:10px;margin-top:12px}.tile{position:relative;background:#eee8f5;color:#271e35;border-radius:3px;padding:2px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;overflow:hidden}.tile.special{background:#f7d75d}.tile .num{font-size:8px;opacity:.65}.tile .nm{font-size:clamp(5px,1.35vw,10px);font-weight:800;line-height:1.05;overflow-wrap:anywhere;text-align:center}.tile .price{font-size:8px;text-align:center}.tile .stripe{height:4px;border-radius:2px}.tokens{display:flex;justify-content:center;flex-wrap:wrap;gap:1px;min-height:9px}.token{width:9px;height:9px;border-radius:50%;border:1px solid white;box-shadow:0 0 2px #333}.center{grid-column:2/9;grid-row:2/9;background:#211b34;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:8px;padding:12px;gap:10px}.center .logo{font-size:clamp(27px,9vw,58px);font-weight:1000;color:#f7d75d;letter-spacing:2px}.center .subtitle{font-size:12px;color:#c2b8d8}.center .dice{font-size:34px}.center .hint{font-size:11px;color:#a9a0c1}.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.player{background:#302745;border-radius:10px;padding:9px;font-size:12px;border:2px solid transparent}.player.active{border-color:#f7d75d}.player.dead{opacity:.45}.player strong{font-size:13px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.controls button{min-height:44px;font-size:13px}.message{font-size:14px;line-height:1.5;min-height:48px}.small{font-size:11px;color:#bcb2cf}#event{background:#3b2e53;border-radius:10px;padding:10px;margin-top:8px;display:none}#event button{margin:4px;font-size:12px}.log{font-size:11px;color:#c7bdd8;max-height:130px;overflow:auto;line-height:1.5}#event input,#event select{max-width:100%;background:#241c34;color:white;border:1px solid #88759d;border-radius:8px;padding:8px;margin:4px} @media(min-width:500px){.tile .nm{font-size:10px}.token{width:12px;height:12px}}
</style></head><body><header><div><h1>BROKE!</h1><div class="tag">GET RICH. OR GET OUT.</div></div><button id="restart" class="secondary">↻ Nouvelle partie</button></header>
<div id="setup" class="panel setup"><div><strong>Nouvelle partie</strong><div class="small">Multijoueur local • 32 cases</div></div><select id="count"><option value="2">2 joueurs</option><option value="3">3 joueurs</option><option value="4">4 joueurs</option></select><button id="start" style="grid-column:1/3">Créer la partie</button></div>
<div id="game" hidden><div id="players" class="players"></div><div id="board" class="board"></div><div class="panel"><div id="turn" style="font-weight:800"></div><div id="message" class="message"></div><div id="event"></div><div class="controls"><button id="roll">🎲 Lancer le dé</button><button id="end" class="secondary" disabled>Fin du tour →</button><button id="upgrade" class="secondary" disabled>⬆ Améliorer</button><button id="assets" class="secondary">🏛 Mes propriétés</button></div></div><div class="panel"><strong>Journal</strong><div id="log" class="log"></div></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id), colors=['#f85b76','#52c7ff','#a7e76b','#dba4ff'];
const raw=[
['Départ','start'],['Empire State','prop',0,120],['Chance','chance'],['Brooklyn Bridge','prop',0,140],['Madison Sq. Garden','prop',0,160],['Négociation','deal'],['Tour Eiffel','prop',1,170],['Arc de Triomphe','prop',1,150],['Braquage','rob'],
['Colisée','prop',2,150],['Fontaine de Trevi','prop',2,130],['Duel','duel'],['Big Ben','prop',3,160],['Tower Bridge','prop',3,140],['Chance','chance'],['London Eye','prop',3,180],['GAV','jail'],
['Burj Khalifa','prop',4,200],['Burj Al Arab','prop',4,180],['Négociation','deal'],['Sagrada Família','prop',5,160],['Casa Batlló','prop',5,140],['Duel','duel'],['Taj Mahal','prop',6,170],['Chance','chance'],
['Butin','pot'],['Statue Liberté','prop',0,180],['Opéra Sydney','prop',7,170],['Harbour Bridge','prop',7,150],['Chance','chance'],['Duel','duel'],['Chance','chance']
];
const families=['New York','Paris','Rome','Londres','Dubaï','Barcelone','Inde','Sydney'];const fc=['#f37383','#5c9bea','#b97a55','#9d80d8','#e5ac44','#5cc3ad','#e57bb6','#73a7b5'];
let players=[],owners={},levels={},current=0,pot=0,phase='none',turnNo=0,finished=false;const cash=n=>`${Math.round(n)} €`;const active=()=>players[current];const propIds=()=>raw.map((s,i)=>s[1]==='prop'?i:-1).filter(i=>i>=0);const owned=p=>propIds().filter(i=>owners[i]===p);const value=p=>p.cash+owned(p).reduce((s,i)=>s+raw[i][3]+(levels[i]||0)*Math.ceil(raw[i][3]*.5),0);
function log(s){const d=document.createElement('div');d.textContent='• '+s;$('log').prepend(d)}function say(s){$('message').textContent=s}function event(html){$('event').style.display='block';$('event').innerHTML=html}function clearEvent(){$('event').style.display='none';$('event').innerHTML=''}function button(label,fn,cls=''){let b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;$('event').appendChild(b)}
function makeBoard(){let board=$('board');board.innerHTML='';for(let i=0;i<32;i++){let s=raw[i],div=document.createElement('div');div.className='tile '+(s[1]!=='prop'?'special':'');let r,c;if(i<=8){r=9;c=1+i}else if(i<=16){r=9-(i-8);c=9}else if(i<=24){r=1;c=9-(i-16)}else{r=1+(i-24);c=1}div.style.gridRow=r;div.style.gridColumn=c;let owner=owners[i],color=s[1]==='prop'?fc[s[2]]:'#f7d75d';div.innerHTML=`<div class="stripe" style="background:${owner===undefined?color:colors[owner]}"></div><div class="num">${i}</div><div class="nm"></div><div class="price">${s[1]==='prop'?cash(s[3]):''}</div><div class="tokens"></div>`;div.querySelector('.nm').textContent=s[0];players.forEach((p,j)=>{if(p.alive&&p.pos===i){let t=document.createElement('span');t.className='token';t.style.background=colors[j];div.querySelector('.tokens').appendChild(t)}});board.appendChild(div)}let center=document.createElement('div');center.className='center';center.innerHTML='<div class="logo">BROKE!</div><div class="subtitle">GET RICH. OR GET OUT.</div><div class="dice" id="dice">🎲</div><div class="hint" id="pot">Butin : 0 €</div>';board.appendChild(center);$('pot').textContent='Butin : '+cash(pot)}
function render(){makeBoard();$('players').innerHTML=players.map((p,i)=>`<div class="player ${i===current?'active':''} ${!p.alive?'dead':''}"><strong><span class="dot" style="background:${colors[i]}"></span>${p.name}</strong><div>${cash(p.cash)} · ${owned(i).length} propriétés</div><div class="small">Patrimoine : ${cash(value(i))}${p.jail?' · GAV '+p.jail+' tour(s)':''}${!p.alive?' · Éliminé':''}</div></div>`).join('');$('turn').textContent=finished?'Partie terminée':`Tour ${turnNo+1} — ${active().name}`;$('roll').disabled=phase!=='roll'||finished;$('end').disabled=phase!=='end'||finished;$('upgrade').disabled=phase!=='end'||finished}
function start(){players=Array.from({length:Number($('count').value)},(_,i)=>({name:'Joueur '+(i+1),cash:1500,pos:0,jail:0,alive:true}));owners={};levels={};current=0;pot=0;phase='roll';turnNo=0;finished=false;$('setup').hidden=true;$('game').hidden=false;$('log').innerHTML='';clearEvent();say('Lance le dé pour commencer !');log('Nouvelle partie de '+players.length+' joueurs.');render()}
function pay(from,to,amount){players[from].cash-=amount;if(to!==null)players[to].cash+=amount;else pot+=amount;log(players[from].name+' paie '+cash(amount)+(to===null?' au Butin':' à '+players[to].name))}
function check(){players.forEach((p,i)=>{if(p.alive&&p.cash< -500&&owned(i).length===0){p.alive=false;log(p.name+' est éliminé (découvert dépassé sans propriété).')}});let alive=players.filter(p=>p.alive);if(alive.length<=1){finished=true;phase='none';say('🏆 '+(alive[0]?.name||'Personne')+' remporte la partie !');clearEvent()}}
function finish(){phase='end';check();render()}
function move(n){let p=active(),old=p.pos;p.pos=(p.pos+n)%32;if(p.pos<old||p.pos===0){p.cash+=p.pos===0?400:200;log(p.name+' reçoit '+cash(p.pos===0?400:200)+' au Départ')}log(p.name+' arrive sur '+raw[p.pos][0]);render();land()}
function land(){let p=active(),i=p.pos,s=raw[i];clearEvent();if(s[1]==='prop'){let owner=owners[i];if(owner===undefined){say(s[0]+' est disponible pour '+cash(s[3])+'.');event('<strong>Acheter cette propriété ?</strong><div class="small">Famille : '+families[s[2]]+'</div>');if(p.cash>=s[3])button('Acheter '+cash(s[3]),()=>{p.cash-=s[3];owners[i]=current;log(p.name+' achète '+s[0]);say('🏛 Propriété achetée !');clearEvent();finish()});button('Passer',()=>{say('Achat ignoré.');clearEvent();finish()},'secondary');phase='choice'}else if(owner!==current){let family=propIds().filter(j=>raw[j][2]===s[2]),complete=family.every(j=>owners[j]===owner);let rent=Math.round(s[3]*.2*(complete?2:1)*(1+(levels[i]||0)));pay(current,owner,rent);say('💸 Loyer de '+cash(rent)+' payé à '+players[owner].name+'.');finish()}else{say('Tu es chez toi !');finish()}}else if(s[1]==='chance'){let cards=[['Prime surprise',()=>{p.cash+=120;log(p.name+' gagne 120 €');say('🎉 Tu gagnes 120 € !')}],['Amende',()=>{pay(current,null,75);say('💸 Tu verses 75 € au Butin.')}],['Réparation urgente',()=>{pay(current,null,50);say('🔧 Réparations : 50 € au Butin.')}],['Héritage',()=>{p.cash+=200;log(p.name+' reçoit 200 €');say('💰 Héritage de 200 € !')}],['Mauvais investissement',()=>{p.cash-=100;log(p.name+' perd 100 €');say('📉 Tu perds 100 € !')}]];let card=cards[Math.floor(Math.random()*cards.length)];card[1]();finish()}else if(s[1]==='pot'){let gain=pot;p.cash+=gain;pot=0;log(p.name+' récupère '+cash(gain)+' du Butin');say('💰 Tu récupères le Butin : '+cash(gain)+' !');finish()}else if(s[1]==='jail'){p.jail=2;say('🚔 GAV : tu manqueras 2 tours, mais tu peux toujours percevoir tes loyers.');finish()}else if(s[1]==='rob'){robbery()}else if(s[1]==='duel'){duel()}else if(s[1]==='deal'){negotiate()}else{say('Case Départ !');finish()}render()}
function robbery(){let targets=players.map((p,i)=>i!==current&&p.alive?i:-1).filter(i=>i>=0);if(!targets.length){finish();return}say('🥷 BRAQUAGE ! Choisis une victime.');event('<strong>Tentative risquée</strong><div class="small">Réussite : 50 %. En cas d’échec : indemnité ou propriété cédée, et 3 tours de GAV.</div>');targets.forEach(t=>button(players[t].name,()=>{clearEvent();let p=active(),v=players[t];if(Math.random()<.5){let amount=Math.max(100,Math.floor(Math.max(v.cash,0)*.2));amount=Math.min(amount,Math.max(v.cash,0));if(amount>0)pay(t,current,amount);say('🥷 Braquage réussi ! Butin : '+cash(amount)+'.');log(p.name+' réussit son braquage')}else{let fine=Math.max(100,Math.ceil(Math.max(p.cash,0)*.1));if(p.cash>=fine||owned(current).length===0&&p.cash>=0){pay(current,t,fine);say('🚨 Braquage raté ! Indemnité de '+cash(fine)+' et 3 tours de GAV.');p.jail=3;finish();return}if(owned(current).length){p.jail=3;say('🚨 Échec ! Choisis une propriété à céder à '+v.name+'.');event('<strong>Propriété à céder</strong>');owned(current).forEach(i=>button(raw[i][0],()=>{owners[i]=t;levels[i]=0;log(p.name+' cède '+raw[i][0]+' à '+v.name);clearEvent();finish()}));phase='choice';render();return}else{p.alive=false;say('🚨 Braquage raté : élimination immédiate.')}}p.jail=3;finish()},'danger'));phase='choice';render()}
function duel(){let opponents=players.map((p,i)=>i!==current&&p.alive&&p.cash>=0?i:-1).filter(i=>i>=0);if(!opponents.length){say('⚔️ Aucun adversaire disponible pour un duel.');finish();return}let t=opponents[Math.floor(Math.random()*opponents.length)],stake=Math.min(100,Math.max(0,active().cash),Math.max(0,players[t].cash));say('⚔️ Duel contre '+players[t].name+' ! Mise : '+cash(stake)+'.');event('<strong>Défi de dés</strong><div class="small">Chaque joueur lance un dé. Le plus grand gagne la mise.</div>');button('Lancer les dés du duel',()=>{let a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);if(a>b)pay(t,current,stake);else if(b>a)pay(current,t,stake);say(`⚔️ ${active().name} : ${a} · ${players[t].name} : ${b}. ${a===b?'Égalité !':a>b?'Tu gagnes !':'Tu perds !'}`);clearEvent();finish()});phase='choice';render()}
function negotiate(){say('🤝 Négociation : propose un achat à un autre joueur.');let choices=propIds().filter(i=>owners[i]!==undefined&&owners[i]!==current);if(!choices.length){say('🤝 Aucune propriété adverse à négocier pour le moment.');finish();return}event('<strong>Offre d’achat</strong><div class="small">Choisis une propriété et fais une offre. L’autre joueur acceptera ou refusera.</div>');choices.forEach(i=>button(raw[i][0],()=>{let seller=owners[i];event('<strong>'+raw[i][0]+' — propriétaire : '+players[seller].name+'</strong><div>Montant de l’offre (€) :</div><input id="offer" type="number" min="1" max="'+Math.max(0,active().cash)+'" value="'+raw[i][3]+'">');button('Proposer',()=>{let amt=Number($('offer').value);if(!Number.isFinite(amt)||amt<1||amt>active().cash){say('Montant invalide ou fonds insuffisants.');return}event('<strong>'+players[seller].name+', acceptes-tu '+cash(amt)+' pour '+raw[i][0]+' ?</strong>');button('Accepter',()=>{pay(current,seller,amt);owners[i]=current;levels[i]=0;say('🤝 Transaction conclue !');clearEvent();finish()});button('Refuser',()=>{say('Offre refusée.');clearEvent();finish()},'secondary')});button('Annuler',()=>{clearEvent();finish()},'secondary') }));button('Passer',()=>{clearEvent();finish()},'secondary');phase='choice';render()}
function upgrade(){let p=current,options=owned(p).filter(i=>levels[i]<3&&propIds().filter(j=>raw[j][2]===raw[i][2]).every(j=>owners[j]===p)&&active().cash>=Math.ceil(raw[i][3]*.5));if(!options.length){say('Pour améliorer : possède toute une famille, dispose de fonds et reste sous 3 niveaux.');return}event('<strong>Choisis une propriété à améliorer</strong>');options.forEach(i=>button(raw[i][0]+' ('+cash(Math.ceil(raw[i][3]*.5))+')',()=>{let cost=Math.ceil(raw[i][3]*.5);active().cash-=cost;levels[i]=(levels[i]||0)+1;log(active().name+' améliore '+raw[i][0]+' au niveau '+levels[i]);say('⬆ '+raw[i][0]+' : niveau '+levels[i]);clearEvent();render()}));button('Fermer',clearEvent,'secondary')}
function assets(){let a=owned(current);event('<strong>Mes propriétés</strong><div class="small">'+(a.length?a.map(i=>raw[i][0]+' · '+families[raw[i][2]]+' · niv. '+(levels[i]||0)).join('<br>'):'Aucune propriété')+'</div>');button('Fermer',clearEvent,'secondary')}
function next(){if(phase!=='end')return;let tries=0;do{current=(current+1)%players.length;tries++}while(!players[current].alive&&tries<=players.length);if(current===0)turnNo++;clearEvent();let p=active();if(p.jail>0){p.jail--;say('🚔 '+p.name+' reste en GAV. Tour passé.');phase='end';log(p.name+' passe un tour en GAV')}else{phase='roll';say('À toi de jouer ! Lance le dé.')}render()}
$('start').onclick=start;$('restart').onclick=()=>{if(confirm('Recommencer une nouvelle partie ?')){$('game').hidden=true;$('setup').hidden=false;phase='none'}};$('roll').onclick=()=>{if(phase!=='roll')return;phase='moving';let n=1+Math.floor(Math.random()*6);log(active().name+' lance '+n);move(n);$('dice').textContent='🎲 '+n};$('end').onclick=next;$('upgrade').onclick=upgrade;$('assets').onclick=assets;
</script></body></html>

function tone(freq,duration,delay=0,type='sine',volume=.12){if(!soundEnabled)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioContext ||= new AC();if(audioContext.state==='suspended')audioContext.resume();const o=audioContext.createOscillator(),g=audioContext.createGain(),t=audioContext.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(volume,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g).connect(audioContext.destination);o.start(t);o.stop(t+duration+.025)}catch(e){}}

function soundFailure(){tone(390,.15,0,'sawtooth',.09);tone(260,.2,.15,'triangle',.11);tone(165,.34,.34,'sawtooth',.08)}
function soundRent(){tone(392,.18,0,'triangle');tone(294,.22,.17,'triangle');tone(220,.3,.34,'triangle')}
function unlockAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioContext)audioContext=new AC();audioContext.resume()}catch(e){}}document.addEventListener('pointerdown',()=>{if(soundEnabled)unlockAudio()},{passive:true});document.addEventListener('touchstart',()=>{if(soundEnabled)unlockAudio()},{passive:true});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&soundEnabled)unlockAudio()});$('sound-toggle').onclick=()=>{soundEnabled=!soundEnabled;$('sound-toggle').textContent=soundEnabled?'🔊 Son : ON':'🔇 Son : OFF';if(soundEnabled){unlockAudio();soundPurchase()}};let stepTimer=null;
function clearStep(){clearTimeout(stepTimer);stepTimer=null;movingCell=-1;movingPlayer=-1;$('move-progress').textContent=''}
function move(){if(diceBusy||phase!=='roll')return;unlockAudio();diceBusy=true;phase='rolling';buttons([]);let p=active(),roller=current;roll=1+Math.floor(Math.random()*6);extraTurn=roll===6;const result=roll,stage=$('dice-stage'),cube=$('dice-cube');stage.classList.remove('hidden','settled');cube.classList.remove('rolling');$('dice-result').textContent='🎲 Le dé roule…';void cube.offsetWidth;cube.classList.add('rolling');say(`${p.name} lance le dé…`);diceTimer=setTimeout(()=>{if(!diceBusy||current!==roller)return;cube.classList.remove('rolling');stage.classList.add('settled');cube.querySelector('.dice-face').textContent=result;$('dice-result').textContent=`Résultat : ${result}`;diceTimer=setTimeout(()=>{if(!diceBusy||current!==roller)return;clearDice();phase='moving';let steps=0;function advance(){if(current!==roller||phase!=='moving')return;if(steps>=result){diceBusy=false;movingCell=-1;movingPlayer=-1;$('move-progress').textContent='';render();say(`🎲 ${result} ! ${p.name} arrive sur ${cells[p.pos].name}.`);land(cells[p.pos]);return}p.pos=(p.pos+1)%32;steps++;movingCell=p.pos;movingPlayer=roller;$('move-progress').textContent=`DÉPLACEMENT : ${steps} / ${result}`;if(p.pos===0){const bonus=steps===result?400:200;p.cash+=bonus;queueCashEffect(roller,bonus);addlog(`${p.name} reçoit ${money(bonus)} au départ.`)}tone(360+steps*32,.065,0,'triangle',.045);render();say(`🎲 ${result} — ${p.name} avance : ${steps}/${result} · ${cells[p.pos].name}`);stepTimer=setTimeout(advance,400)}advance()},550)},1500)}
function land(c){let p=active();if(prop(c)){if(c.owner===-1){if(p.cash<c.price){say('Fonds insuffisants : tour terminé automatiquement.');finish(true);return}buttons([[`Acheter • ${money(c.price)}`,()=>{if(p.cash<c.price){say('Fonds insuffisants.');finish(true);return}p.cash-=c.price;c.owner=current;c.level=0;addlog(`${p.name} achète ${c.name}.`);unlockAudio();soundPurchase();finish()}],['Passer',finish,true]]);return}if(c.owner===current){say('Tu es chez toi !');finish();return}let family=cells.filter(z=>z.type===c.type);let monopoly=family.every(z=>z.owner===c.owner);let rent=rentFor(c);say(`Loyer de ${money(rent)} à ${players[c.owner].name}${monopoly?' (famille complète)':''}.`);unlockAudio();soundRent();if(!charge(p,rent,c.owner))finish();render();return}
switch(c.type){case'start':say('Départ : bonus déjà crédité pendant le déplacement.');break;case'loot':{let amt=loot;p.cash+=amt;loot=0;say(amt?`💰 Butin récupéré : +${money(amt)} !`:'💰 La cagnotte est vide : aucun gain.');break}case'bonus':p.cash+=150;say('Prime : +150 € !');break;case'tax':loot+=100;if(charge(p,100)){render();return}say('Taxe : -100 € versés à la cagnotte.');break;case'chance':{let amt=[-150,-100,100,150,200][Math.floor(Math.random()*5)];if(amt<0){loot+=-amt;addlog(`Chance : ${money(-amt)} versés à la cagnotte.`);queueCashEffect(current,amt);unlockAudio();soundFailure();if(charge(p,-amt)){render();return}}else p.cash+=amt;say(`Chance : ${amt>0?'+':''}${money(amt)}${amt<0?' versés à la cagnotte':''}`);break}case'jail':p.jail=2;say('🚔 GAV : 2 tours passés automatiquement. Loyers conservés.');addlog(`${p.name} est placé en GAV pour 2 tours.`);break;case'deal':deal();return;case'casino':casino();return;case'rob':rob();return}finish()}

function deal(){
 const p=active(),mine=cells.filter(c=>c.owner===current),others=cells.filter(c=>c.owner>=0&&c.owner!==current);
 if(!others.length){say('Aucune propriété adverse à négocier.');finish(true);return}
 popup('🤝 Négociation','Choisis une option :',[
 ['💶 Rachat de propriété',()=>buyDeal()],
 ['🔁 Échange de propriétés',()=>exchangeDeal()],
 ['Passer',()=>finish(true)]
 ]);
}
function buyDeal(){
 const p=active(),others=cells.filter(c=>c.owner>=0&&c.owner!==current);
 popup('🤝 Rachat','Choisis une propriété adverse.',[
 ...others.map(c=>[`${c.name} · ${money(c.price)}`,()=>{
 const seller=players[c.owner];if(p.cash<c.price){popup('Rachat impossible','Liquidités insuffisantes.',[['Retour',buyDeal]]);return}
 popup('Offre de rachat',`${p.name} offre ${money(c.price)} à ${seller.name} pour ${c.name}.`,[
 ['Accepter',()=>{p.cash-=c.price;seller.cash+=c.price;c.owner=current;c.level=0;render();say('Rachat accepté.');finish(true)}],
 ['Refuser',()=>{say('Offre refusée.');finish(true)}]
 ])
 }]),['Retour',deal]
 ])
}
function exchangeDeal(){
 const mine=cells.filter(c=>c.owner===current);
 if(!mine.length){popup('Échange','Tu ne possèdes aucune propriété à proposer.',[['Retour',deal]]);return}
 popup('🔁 Échange','Choisis la propriété que tu souhaites proposer.',[
 ...mine.map(offered=>[offered.name,()=>exchangeResponses(offered,players.map((p,i)=>i).filter(i=>i!==current&&!players[i].bankrupt),0,[])]),
 ['Retour',deal]
 ])
}
function exchangeResponses(offered,opponents,index,offers){
 if(index>=opponents.length){
 if(!offers.length){say('Aucune proposition reçue.');finish(true);return}
 popup('🔁 Offres reçues',`Tu proposes ${offered.name}. Choisis une offre à accepter ou refuse toutes les propositions.`,[
 ...offers.map(o=>[`${players[o.player].name} : ${o.property.name}`,()=>{
 if(offered.owner!==current||o.property.owner!==o.player){say('Cette propriété a changé de propriétaire.');finish(true);return}
 offered.owner=o.player;o.property.owner=current;players[current].cash+=100;players[o.player].cash+=100;queueCashEffect(current,100);queueCashEffect(o.player,100);soundPurchase();render();addlog('Bonus de transaction : +100 € pour chaque joueur.');say(`Échange conclu : ${offered.name} contre ${o.property.name}.`);finish(true)
 }]),['Tout refuser',()=>{say('Échange refusé.');finish(true)}]
 ]);return
 }
 const opponent=opponents[index],candidate=cells.filter(c=>c.owner===opponent);
 popup('🔁 Proposition',`${players[opponent].name} : ${players[current].name} propose ${offered.name}. Souhaites-tu proposer une propriété en retour ?`,[
 ...candidate.map(c=>[c.name,()=>exchangeResponses(offered,opponents,index+1,[...offers,{player:opponent,property:c}])]),
 ['Passer',()=>exchangeResponses(offered,opponents,index+1,offers)]
 ])
}
// Roulette européenne : 18 rouges, 18 noirs et un seul zéro vert.
const rouletteRed=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
function casino(){
 const p=active();
 if(p.cash<=0){say('🎰 Casino : aucune liquidité disponible pour miser.');finish(true);return}
 popup('🎰 Casino',`<p>Roulette européenne : 18 rouges, 18 noirs et 1 vert (zéro).</p><label class="casino-label">Ta mise (€)<input id="casino-stake" type="number" inputmode="numeric" min="1" max="${Math.floor(p.cash)}" step="1" value="${Math.min(100,Math.floor(p.cash))}"></label><p class="hint">Rouge / Noir : gain net de 1× la mise (18/37). Vert : gain net de 35× la mise (1/37). Mise maximale : ${money(p.cash)}.</p>`,[['Ne pas jouer',()=>{say('Tu quittes le casino sans miser.');finish(true)}]]);
 const buttonsArea=$('modalactions');
 for(const [color,label] of [['red','🔴 Rouge'],['black','⚫ Noir'],['green','🟢 Vert']]){
  const btn=document.createElement('button');btn.textContent=label;btn.className='casino-bet '+color;
  btn.onclick=()=>{
   const stake=Number($('casino-stake').value);
   if(!Number.isInteger(stake)||stake<1||stake>Math.floor(p.cash)){alert(`Entre une mise entière de 1 à ${Math.floor(p.cash)} €.`);return}
   close();phase='casino';buttons([]);const n=Math.floor(Math.random()*37),resultColor=n===0?'green':rouletteRed.has(n)?'red':'black';
   const resultLabel={red:'🔴 Rouge',black:'⚫ Noir',green:'🟢 Vert'}[resultColor];
   say('🎰 La roulette tourne…');
   const overlay=document.createElement('div');overlay.className='casino-spin';overlay.innerHTML='<div class="roulette-wheel">🎰</div><div>La roulette tourne…</div>';
   $('board').appendChild(overlay);tone(440,.1,0,'triangle',.06);tone(540,.1,.2,'triangle',.06);
   setTimeout(()=>{
    overlay.remove();p.cash-=stake;
    const won=color===resultColor;
    if(won)p.cash+=stake*(color==='green'?36:2);
    const delta=won?stake*(color==='green'?35:1):-stake;
    addlog(`${p.name} mise ${money(stake)} sur ${label}. Roulette ${n} ${resultLabel} : ${won?'gain':'perte'} ${money(Math.abs(delta))}.`);
    if(won)soundPurchase();else soundRent();
    render();say(`🎰 ${n} ${resultLabel} ! ${won?'Gagné : +':'Perdu : −'}${money(Math.abs(delta))}.`);
    if(p.cash<0){checkDebt(p);return}
    finish(true);
   },1650);
  };buttonsArea.prepend(btn)
 }
}

function rob(){let p=active();let targets=players.filter((x,i)=>i!==current&&!x.bankrupt);popup('💥 Braquage',`Choisis une victime. Réussite : vol de 200 € (dans la limite de ses liquidités positives). Échec : indemnité égale à 10 % de ton solde positif, minimum 100 €, et 3 tours de GAV.`,[...targets.map(t=>[t.name,()=>{let success=Math.random()<.5;if(success){let amount=Math.min(200,Math.max(0,t.cash));t.cash-=amount;p.cash+=amount;say(`Braquage réussi ! +${money(amount)} pris à ${t.name}.`);addlog(`${p.name} braque ${t.name} : +${money(amount)}.`);finish()}else{let due=Math.max(100,round10(Math.max(0,p.cash)*.1));p.jail=3;p.pos=16;extraTurn=false;let owned=cells.filter(c=>c.owner===current);if(p.cash>=due){p.cash-=due;t.cash+=due;addlog(`${p.name} rate son braquage, verse ${money(due)} et part en GAV.`);say(`Braquage raté : -${money(due)} et 3 tours de GAV.`);finish()}else if(owned.length){popup('Braquage raté !',`Liquidités insuffisantes : cède une propriété de ton choix à ${t.name}. Tu écopes aussi de 3 tours de GAV.`,owned.map(c=>[c.name,()=>{c.owner=players.indexOf(t);addlog(`${p.name} cède ${c.name} à ${t.name} et part en GAV.`);finish()}]))}else{p.cash-=due;t.cash+=due;addlog(`${p.name} paie ${money(due)} même en négatif et part en GAV.`);say(`Braquage raté : -${money(due)} et 3 tours de GAV.`);finish()}}}]),['Annuler',finish]])}

function propertyList(){
 if(!['roll','end'].includes(phase)||gameOver)return;
 const mine=cells.filter(c=>c.owner===current);
 popup('🏛 Mes propriétés',mine.length?'Sélectionne une propriété.':'Tu ne possèdes aucune propriété.',[
 ...mine.map(c=>[c.name,()=>openProperty(c)]),['Fermer',()=>{}]
 ]);document.querySelectorAll('#modalactions button').forEach((b,i)=>{if(i<mine.length){b.style.background=F[mine[i].type][1];b.style.color='#111827';b.style.border='2px solid #ffffff33'}});
}
function openProperty(c){
 if(!prop(c)||!players.length)return;
 const owned=c.owner>=0,own=owned?players[c.owner]:null;
 const editable=owned&&c.owner===current&&!gameOver&&['roll','end'].includes(phase);
 const cost=upgradeCost(c),sellPrice=round10(c.price*.7)+c.level*round10(cost*.7);
 const nextRent=c.level<3?rentFor({...c,level:c.level+1}):rentFor(c);
 const ownerLabel=own?own.name:'Aucun propriétaire';
 const family=F[c.type]?.[0]||'Monument';
 const body=`<div class="property-sheet">
 <div class="property-family">${family}</div>
 <div class="property-info"><span>Propriétaire</span><strong style="color:${own?colors[c.owner]:'#fff'}">${ownerLabel}</strong></div>
 <div class="property-info"><span>Prix d'achat</span><strong>${money(c.price)}</strong></div>
 <div class="property-info"><span>Valeur de vente à la banque</span><strong>${money(sellPrice)}</strong></div>
 <div class="property-info"><span>Loyer actuel</span><strong>${money(rentFor(c))}</strong></div>
 <div class="property-info"><span>Améliorations</span><strong>${c.level} / 3</strong></div>
 <div class="property-info"><span>Loyer au niveau suivant</span><strong style="color:#a7e76b">${c.level<3?money(nextRent):'Niveau maximal'}</strong></div>
 ${editable?'<p class="property-tip">Cette propriété vous appartient : vous pouvez la gérer.</p>':'<p class="property-tip">Consultation uniquement.</p>'}
 </div>`;
 const actions=[];
 if(editable){
  if(complete(c)&&c.level<3&&active().cash>=cost)actions.push(['⬆ Améliorer · '+money(cost),()=>{
    if(c.owner!==current||gameOver||!['roll','end'].includes(phase)||!complete(c)||c.level>=3||active().cash<cost)return;
    active().cash-=cost;c.level++;soundPurchase();render();say(`${c.name} amélioré : loyer ${money(rentFor(c))}.`);if(!checkVictory())openProperty(c);
  }]);
  actions.push(['💰 Vendre à la banque · '+money(sellPrice),()=>{
    popup('Confirmer la vente',`Vendre ${c.name} à la banque pour ${money(sellPrice)} ?`,[
      ['Confirmer',()=>{
        if(c.owner!==current||gameOver||!['roll','end'].includes(phase))return;
        active().cash+=sellPrice;c.owner=-1;c.level=0;render();say(`${c.name} vendu à la banque pour ${money(sellPrice)}.`);if(!checkVictory())updateTools();
      }],
      ['Annuler',()=>openProperty(c)]
    ]);
  }]);
 }
 actions.push(['Fermer',()=>{}]);
 popup('🏛 '+c.name,body,actions);
}
function checkVictory(){
 if(gameOver)return true;
 const winners=players.map((p,i)=>({p,i,value:wealth(i)})).filter(x=>!x.p.bankrupt&&x.value>=goal);
 if(winners.length){endGame(winners.sort((a,b)=>b.value-a.value)[0].i,'Objectif de fortune atteint');return true}
 return false
}
function endGame(winner,reason){
 if(gameOver)return;gameOver=true;phase='gameover';clearInterval(timerId);clearStep();clearDice();close();endDealPeek();render();
 say(`🏆 ${players[winner].name} gagne ! ${reason}. Fortune : ${money(wealth(winner))}.`);
 buttons([['Nouvelle partie',reset]]);
}
function clockTick(){
 if(gameOver||!deadline)return;
 const remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));
 $('timerlabel').textContent=`⏱ Temps restant : ${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`;
 if(!remaining){
 const winner=players.map((p,i)=>({i,w:wealth(i)})).filter(x=>!players[x.i].bankrupt).sort((a,b)=>b.w-a.w)[0];
 endGame(winner.i,'Temps écoulé')
 }
}
$('timed').onchange=()=>{$('duration-row').classList.toggle('hidden',$('timed').value==='0')};

function reset(){gameOver=false;clearInterval(timerId);deadline=0;extraTurn=false;clearStep();clearDice();endDealPeek();loot=0;$('setup').classList.remove('hidden');$('game').classList.add('hidden');close()}$('restart').onclick=()=>popup('Recommencer ?','La partie en cours sera perdue.',[['Oui, recommencer',reset],['Annuler',()=>{}]]);$('start').onclick=()=>{clearStep();clearDice();phase='roll';gameOver=false;extraTurn=false;goal=Number($('target').value);clearInterval(timerId);deadline=$('timed').value==='1'?Date.now()+Number($('duration').value)*60000:0;timerId=deadline?setInterval(clockTick,1000):null;$('timerlabel').textContent='';clockTick();let n=+$('count').value;players=Array.from({length:n},(_,i)=>({name:`Joueur ${i+1}`,cash:1500,pos:0,jail:0,bankrupt:false}));cells.forEach(c=>{c.owner=-1;c.level=0});current=0;loot=0;cashEffects.clear();endDealPeek();logs=[];$('setup').classList.add('hidden');$('game').classList.remove('hidden');render();say('Bienvenue dans BROKE! Lance le dé pour commencer.');buttons([['🎲 Lancer le dé',move]])};
</script></body></html>
